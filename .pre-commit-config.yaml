repos:
  - repo: local
    hooks:
      # FAIL-only for now: WARN stays advisory until it has been zero for two
      # weeks, then add `--strict` here and in .github/workflows/doc-guard.yml.
      - id: doc-check
        name: doc-check (doc map / vocabulary / file reconciliation)
        entry: bash scripts/doc-check.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: doc-guard
        name: doc-guard (tag/architecture/link checks)
        entry: python3 scripts/doc_guard.py --files
        language: system
        pass_filenames: true
        types_or: [python, markdown]

      - id: regen-adr-index
        name: regen-adr-index
        entry: python3 scripts/regen_adr_index.py
        language: system
        pass_filenames: false
        files: '^docs/decisions/.*\.md$'

      - id: audit-tags
        name: audit-tags (regression check)
        entry: python3 scripts/audit_tags.py
        language: system
        pass_filenames: false
        files: '^(core|data_pipeline|services|utils)/.*\.py$'
