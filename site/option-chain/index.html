<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Option Chain — OptionLab Pages</title>
  <link rel="stylesheet" href="../assets/pages-shell.css" />
  <link rel="stylesheet" href="../vendor/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>window.PAGES_SAMPLE = { base: '../fixtures' };</script>
  <script src="../assets/pages-sample.js"></script>
</head>
<body>
<div class="pages-wrap">
  <p class="muted"><a href="../">← 门户</a> · Option Chain <span class="badge badge--sample">示例数据可交互</span></p>
  <h1>Option Chain</h1>
  <div class="pages-notice pages-notice--sample" id="pages-sample-note" role="status" aria-live="polite">
    <strong>示例数据：</strong><span data-sample-msg>NVDA 合成快照（非实时），到期切换 / KPI / 现货线全可用。</span>
    实时链需 Flask <code>GET /api/option_chain</code>（yfinance）。
  </div>
  <div class="pages-card" style="margin-bottom:.75rem">
    <label>Ticker <input id="ticker" value="NVDA" style="width:120px" /></label>
    <input id="cfg-max-dte" type="hidden" value="45" />
    <input id="cfg-moneyness-low" type="hidden" value="0.7" />
    <input id="cfg-moneyness-high" type="hidden" value="1.3" />
    <button class="btn" onclick="loadOptionChain()">Reload</button>
  </div>
  <section class="kpi-strip" id="oc-kpi-strip" aria-label="Option chain key metrics">
    <div class="kpi-card" data-oc-kpi="spot"><span class="kpi-card__label">Spot</span><span class="kpi-card__value" data-oc-kpi-value>—</span><span class="kpi-card__sub" data-oc-kpi-sub></span></div>
    <div class="kpi-card" data-oc-kpi="expirations"><span class="kpi-card__label">Expirations</span><span class="kpi-card__value" data-oc-kpi-value>—</span><span class="kpi-card__sub" data-oc-kpi-sub></span></div>
    <div class="kpi-card" data-oc-kpi="active-exp"><span class="kpi-card__label">Active Expiry</span><span class="kpi-card__value" data-oc-kpi-value>—</span><span class="kpi-card__sub" data-oc-kpi-sub></span></div>
  </section>
  <div id="oc-exp-tabs"><div id="oc-exp-tab-list" style="display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0"></div></div>
  <div id="oc-chain-body"></div>
  <p class="muted">渲染器与 Flask 版同源（<code>static/option-chain.js</code>）；Pages 下自动降级到 <code>fixtures/option_chain.nvda.json</code>。</p>
</div>
<script src="../vendor/eventBus.js"></script>
<script src="../vendor/api.js"></script>
<script src="../vendor/state/store.js"></script>
<script src="../vendor/state/optionChainState.js"></script>
<script src="../vendor/state/oddsChainState.js"></script>
<script src="../vendor/state/panelState.js"></script>
<script src="../vendor/option-chain.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    try { window.appState.panels.set('option_chain', 'loading', { message: 'Loading sample chain…' }); } catch (_) {}
    loadOptionChain();
  });
</script>
</body>
</html>
