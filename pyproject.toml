[project]
name = "OptionStrategy"
version = "1.0.0"
description = "Flask-based market analysis dashboard with options strategy tools"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# WHY: the repo has no top-level package, so `from app import app` in the test
# modules only resolves when the repo root is on sys.path. `python -m pytest`
# adds it implicitly; the bare `pytest` console script (what CI runs) does not.
# Pin it here so every entry point — CI, `pytest tests/e2e`, local runs — agrees.
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-x --tb=short -q"
markers = [
    "network: tests that hit live yfinance (may be rate-limited)",
]
filterwarnings = [
    # Matplotlib / pyparsing deprecation noise — not our code
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:pyparsing.*",
    # Pandas divide-by-zero in log returns during synthetic data tests
    "ignore::RuntimeWarning:pandas.*",
    "ignore::RuntimeWarning:numpy.*",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["core", "services", "data_pipeline", "utils"]
# Formatting style changes between ruff minor releases, so an unpinned local
# ruff silently disagrees with CI. Keep this in sync with the pinned version in
# .github/workflows/ci.yml.
required-version = ">=0.16.5,<0.17"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # raise-without-from-inside-except (too noisy in legacy code)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "services", "data_pipeline", "utils"]

[tool.ruff.format]
quote-style = "double"
