name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'site/**'
      - 'scripts/gen_pages_fixtures.py'
      - 'scripts/build_pages_showcase.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Regenerate deterministic fixtures + showcase so committed site/
      # can never drift from the generator scripts.
      - name: Generate fixtures and showcase
        run: |
          python scripts/gen_pages_fixtures.py
          python scripts/build_pages_showcase.py

      # Vendor live static JS/CSS + sim engine into the published tree.
      # Pages subpages reference ../vendor/* and ../fixtures/* with relative
      # paths so the Project Pages subpath (/OptionLab/) keeps working.
      - name: Assemble site
        run: |
          mkdir -p site/sim site/vendor/sim site/vendor/state site/fixtures site/showcase site/assets
          cp -r static/sim/* site/sim/
          cp -r static/sim/* site/vendor/sim/
          cp static/api.js static/eventBus.js static/option-chain.js static/market_review_chart.js static/market_review.js static/premium_matrix.js static/simulation.js static/utils.js site/vendor/
          cp -r static/state/* site/vendor/state/
          rm -f site/vendor/state/README.md
          cp static/styles.css site/vendor/styles.css
          echo "--- site tree ---" && find site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
