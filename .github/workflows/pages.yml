name: Deploy Frontend to GitHub Pages

# The Pages site is an identical-UI static mirror of the Flask app:
# scripts/build_pages_site.py renders the REAL templates/index.html with a
# committed data snapshot (site/snapshot/snapshot.json) using REAL static/*.
# Only site/pages-shim.js is Pages-only code (demo fetch stub). static/* and
# templates/* are never forked for Pages — one UI to learn.
on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'templates/**'
      - 'site/snapshot/**'
      - 'site/fixtures/**'
      - 'site/pages-shim.js'
      - 'scripts/build_pages_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Assemble is CI-safe by design: plain Jinja2 render of the committed
      # snapshot + verbatim static/ copy. No network, no DB, no matplotlib.
      # Refresh the snapshot locally via:
      #   python scripts/build_pages_site.py --refresh-snapshot
      - name: Assemble site
        run: |
          pip install jinja2
          python scripts/build_pages_site.py
          echo "--- site tree ---" && find site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
