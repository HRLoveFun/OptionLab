name: Deploy Simulator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/sim/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The simulator is a pure static site. Vendor the engine into the site tree
      # so the published artifact is fully self-contained (no backend dependency).
      - name: Assemble site
        run: |
          mkdir -p site/sim
          cp -r static/sim/* site/sim/
          echo "engine files:" && ls site/sim

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
