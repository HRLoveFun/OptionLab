<div class="tab-content" id="tab-odds" x-data="panelState('odds')">
    <div class="toolbar">
        <div class="panel-header" style="margin:0;">
            <h2>Expiry Odds</h2>
            <p class="panel-desc">Profit odds per strike with implied volatility context.</p>
        </div>
        <div class="toolbar-actions">
            <button type="button" class="btn-primary" data-action="odds-reload"
                    :disabled="phase === 'loading'">
                <template x-if="phase !== 'loading'"><span>Reload</span></template>
                <template x-if="phase === 'loading'"><span>Loading…</span></template>
            </button>
        </div>
    </div>

    <!-- Loading -->
    <div class="panel-banner panel-banner--loading" x-show="phase === 'loading'" x-cloak>
        <span x-text="message || 'Loading odds data...'"></span>
    </div>

    <!-- Error -->
    <div class="panel-banner panel-banner--error" x-show="phase === 'error'" x-cloak>
        <span x-text="message"></span>
    </div>

    <!-- Loaded content -->
    <div x-show="phase === 'loaded'" x-cloak>
        <div class="odds-controls" role="group" aria-label="Odds chart controls">
            <div class="odds-control">
                <label class="odds-control__label" for="odds-target-pct">est. move
                    <span class="label-unit">% &times; Spot</span></label>
                <div class="odds-control__row">
                    <input type="range" id="odds-target-range" class="odds-range__input" min="0" max="50" step="1"
                           value="10" aria-label="Estimated move, percent of spot" />
                    <input type="number" id="odds-target-pct" class="oc-target-input odds-control__num" value="10"
                           min="0" max="50" step="1" />
                </div>
                <span id="odds-target-value" class="oc-target-value"></span>
            </div>
            <div class="odds-control">
                <label class="odds-control__label" id="odds-dte-label">expiry window
                    <span class="label-unit">days to expiry</span></label>
                <div class="odds-control__row">
                    <input type="number" id="odds-dte-lo-num" class="oc-target-input odds-control__num"
                           min="0" max="90" step="1" value="0" aria-label="Earliest days to expiry" />
                    <div class="odds-range-dual" role="group" aria-labelledby="odds-dte-label">
                        <div class="odds-range-dual__track"><div class="odds-range-dual__fill" id="odds-dte-fill"></div></div>
                        <input type="range" id="odds-dte-lo" class="odds-range__input" min="0" max="90" step="1"
                               value="0" aria-label="Earliest days to expiry" />
                        <input type="range" id="odds-dte-hi" class="odds-range__input" min="0" max="90" step="1"
                               value="90" aria-label="Latest days to expiry" />
                    </div>
                    <input type="number" id="odds-dte-hi-num" class="oc-target-input odds-control__num"
                           min="0" max="90" step="1" value="90" aria-label="Latest days to expiry" />
                </div>
            </div>
        </div>
        <div id="odds-charts-wrapper">
            <div class="content-card">
                <div class="content-card-title">Long Call / Long Put Odds</div>
                <div class="chart-wrapper chart-wrapper--odds">
                    <div class="odds-group-toggles" role="group" aria-label="Odds curve groups">
                        <button type="button" class="btn-toggle btn-sm active" id="odds-toggle-call"
                                data-odds-group="call" aria-pressed="true">
                            <span class="odds-group-line odds-group-line--call" aria-hidden="true"></span>Call
                        </button>
                        <button type="button" class="btn-toggle btn-sm active" id="odds-toggle-put"
                                data-odds-group="put" aria-pressed="true">
                            <span class="odds-group-line odds-group-line--put" aria-hidden="true"></span>Put
                        </button>
                    </div>
                    <canvas id="odds-combined-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty / idle -->
    <div class="empty-state" x-show="phase === 'idle' || phase === 'empty'" x-cloak>

        <p x-show="phase === 'idle'">Set a ticker in <strong>Parameter</strong> tab — odds data loads automatically when you switch to this tab.</p>
        <p x-show="phase === 'empty'" x-text="message || 'No valid option data to compute odds.'"></p>
    </div>
</div>
